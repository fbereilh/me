name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    # The server is ARM, so build natively on an ARM runner instead of emulating.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # buildx is needed for the GitHub Actions layer cache below
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/fbereilh/me:latest
            ghcr.io/fbereilh/me:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The server polls the registry every few minutes and pulls new images itself.
